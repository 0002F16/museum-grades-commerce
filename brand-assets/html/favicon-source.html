<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:512px;height:512px;overflow:hidden;background:transparent;}
.icon{
  width:512px;height:512px;
  background:rgb(25,28,31);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
/* thin top rule — brand detail */
.icon::before{
  content:"";
  position:absolute;
  top:52px;left:72px;right:72px;
  height:2px;
  background:rgba(255,255,255,0.22);
}
/* thin bottom rule */
.icon::after{
  content:"";
  position:absolute;
  bottom:52px;left:72px;right:72px;
  height:2px;
  background:rgba(255,255,255,0.22);
}
.letter{
  font-family:"Metropolis","Helvetica Neue",Arial,sans-serif;
  font-weight:700;
  font-size:268px;
  color:#ffffff;
  letter-spacing:-6px;
  line-height:1;
  /* slight upward nudge for optical centering */
  margin-top:-8px;
  -webkit-font-smoothing:antialiased;
}
</style>
</head>
<body>
  <div class="icon">
    <span class="letter">M</span>
  </div>
</body></html>
