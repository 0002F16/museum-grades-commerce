<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Metropolis","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
:root{--ink:rgb(25,28,31);--slate:rgb(89,89,89);--lgray:rgb(112,112,112);--border:rgb(229,229,229);}
body{width:1080px;height:1080px;background:#fff;}
.frame{width:1080px;height:1080px;padding:64px;display:flex;flex-direction:column;}
.top{display:flex;justify-content:space-between;align-items:flex-start;}
.wm{font-size:26px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--ink);}
.eyebrow{font-size:15px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--lgray);}
.image{flex:1;margin:48px 0;background:rgb(245,245,245);position:relative;overflow:hidden;}
.image img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.02);}
.tagrow{position:absolute;left:0;right:0;bottom:0;padding:28px 34px;background:linear-gradient(transparent,rgba(18,18,18,.62));display:flex;justify-content:space-between;align-items:flex-end;}
.tagrow .brand{font-size:18px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#fff;}
.tagrow .cond{font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:9px;}
.tagrow .dot{width:11px;height:11px;border:2px solid #fff;display:inline-block;}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;}
.headline{font-size:44px;font-weight:200;letter-spacing:-0.01em;color:var(--ink);line-height:1.15;}
.cta{border:1px solid var(--ink);height:62px;padding:0 36px;display:flex;align-items:center;font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ink);white-space:nowrap;}
</style></head>
<body>
  <div class="frame">
    <div class="top">
      <div class="wm">Museum Grades</div>
      <div class="eyebrow">Featured Acquisition</div>
    </div>
    <div class="image">
      <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=1200&q=80&auto=format&fit=crop">
      <div class="tagrow">
        <span class="brand">Herm&egrave;s &middot; Birkin 30</span>
        <span class="cond"><span class="dot"></span>Authenticated &middot; Excellent</span>
      </div>
    </div>
    <div class="bottom">
      <div class="headline">The catalogue,<br>quietly updated.</div>
      <div class="cta">Shop the Piece</div>
    </div>
  </div>
</body></html>
