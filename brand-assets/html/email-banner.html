<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Metropolis","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
:root{--ink:rgb(25,28,31);--slate:rgb(89,89,89);--lgray:rgb(112,112,112);--border:rgb(229,229,229);}
body{width:1600px;height:560px;background:#fff;}
.banner{width:1600px;height:560px;display:flex;}
.left{flex:1;padding:80px 90px;display:flex;flex-direction:column;justify-content:space-between;}
.wm{font-size:24px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--ink);}
.eyebrow{font-size:15px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--lgray);}
.headline{font-size:58px;font-weight:200;letter-spacing:-0.02em;line-height:1.08;color:var(--ink);margin-top:22px;}
.sub{font-size:19px;line-height:1.6;color:var(--slate);margin-top:24px;max-width:560px;}
.cta{align-self:flex-start;background:var(--ink);color:#fff;height:64px;padding:0 44px;display:flex;align-items:center;font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase;}
.right{width:520px;background:rgb(245,245,245);position:relative;overflow:hidden;}
.right img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.02);}
</style></head>
<body>
  <div class="banner">
    <div class="left">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="wm">Museum Grades</span>
        <span class="eyebrow">The Collector&apos;s Catalogue</span>
      </div>
      <div>
        <div class="headline">New acquisitions,<br>now catalogued.</div>
        <div class="sub">A considered selection of authenticated, condition-graded pieces &mdash; added quietly, for the discerning collector.</div>
      </div>
      <div class="cta">View the Collection</div>
    </div>
    <div class="right">
      <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=1100&q=80&auto=format&fit=crop">
    </div>
  </div>
</body></html>
